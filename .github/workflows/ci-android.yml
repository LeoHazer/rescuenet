name: CI Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
  push:
    branches: [develop, main]
    paths:
      - 'apps/android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

       - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}

      - name: Permissão de execução do gradlew
        run: chmod +x gradlew

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: rescuenet-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk