# Infraestrutura do RescueNet: broker MQTT e banco PostgreSQL.
#
#   docker compose up -d      sobe tudo (na primeira vez, cria as tabelas)
#   docker compose down       para e remove os containers (mantém os dados)
#   docker compose down -v    também apaga os dados do banco
#
# Projeto acadêmico de demonstração: usuário e senha ficam fixos aqui e no
# backend (backend/internal/database/postgres.go).

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: rescuenet-mqtt
    # Aceita conexões de qualquer endereço sem senha (celulares na rede local).
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: rescuenet-db
    environment:
      POSTGRES_DB: rescuenet
      POSTGRES_USER: rescuenet
      POSTGRES_PASSWORD: rescuenet
    ports:
      # 5433 no computador, para não conflitar com um PostgreSQL já instalado.
      - "5433:5432"
    volumes:
      # Na primeira criação do banco, os scripts são executados em ordem
      # (001, 002, 003) e criam todas as tabelas.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - rescuenet-db:/var/lib/postgresql/data
    healthcheck:
      # Via TCP: durante a inicialização o Postgres só aceita conexões locais,
      # então o banco só é considerado pronto depois dos scripts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rescuenet", "-d", "rescuenet"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  rescuenet-db:
